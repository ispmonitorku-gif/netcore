        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #09090b; 
            color: #f4f4f5; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
            overflow-x: hidden; 
            width: 100vw;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),

                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, transparent 50%);
            background-attachment: fixed;
            /* Mencegah default action dari browser saat touch */
            touch-action: pan-y; 
        }

        /* Wrapper untuk custom zoom */
        #app-zoom-wrapper {
            transform-origin: 0 0;
            will-change: transform;
            min-height: 100vh;
            width: 100%;
        }

        .glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: linear-gradient(135deg, rgba(39, 39, 42, 0.4) 0%, rgba(24, 24, 27, 0.8) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .glass-input { background: rgba(9, 9, 11, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .glass-input:focus { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); background: rgba(9, 9, 11, 0.8); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .8; transform: scale(1.05); } }

        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: slideOutRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 120px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .nav-safe { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 15px); }
    </style>
</head>

    <script>
        /* 
         ========================================================================
         SISTEM CUSTOM PINCH-TO-ZOOM (2 JARI)
         Fungsi ini mengabaikan zoom bawaan HP tapi mendeteksi sentuhan 2 jari
         untuk melakukan zoom kustom dengan menggunakan CSS Transform, sehingga 
         terasa seperti aplikasi native.
         ========================================================================
        */
        
        const zoomWrapper = document.getElementById('app-zoom-wrapper');
        let currentScale = 1;
        let initialDistance = 0;
        let scaleBeforePinch = 1;
        
        // Posisi X/Y (Pan)
        let translateX = 0;
        let translateY = 0;
        let startX = 0;
        let startY = 0;
        let initialTranslateX = 0;
        let initialTranslateY = 0;

        // Untuk menghitung jarak antara 2 jari
        function getDistance(touches) {
            return Math.hypot(
                touches[0].pageX - touches[1].pageX,
                touches[0].pageY - touches[1].pageY
            );
        }

        // Apply Transform ke Wrapper
        function updateTransform() {
            // Batasi agar tidak bergeser jika scale = 1
            if (currentScale <= 1) {
                translateX = 0;
                translateY = 0;
            }
            zoomWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // Saat ada 2 jari -> Mode ZOOM
                e.preventDefault(); // Matikan behavior bawaan browser
                initialDistance = getDistance(e.touches);
                scaleBeforePinch = currentScale;
            } else if (e.touches.length === 1 && currentScale > 1) {
                // Saat ada 1 jari dan sedang ter-zoom -> Mode PAN (Geser)
                startX = e.touches[0].pageX;
                startY = e.touches[0].pageY;
                initialTranslateX = translateX;
                initialTranslateY = translateY;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                // Proses Zoom
                e.preventDefault();
                const currentDistance = getDistance(e.touches);
                const scaleDiff = currentDistance / initialDistance;
                
                // Set Batasan Zoom (Minimal 1x, Maksimal 5x)
                let newScale = scaleBeforePinch * scaleDiff;
                currentScale = Math.min(Math.max(1, newScale), 5);
                
                updateTransform();
            } else if (e.touches.length === 1 && currentScale > 1) {
                // Proses Panning (Geser layar saat sedang di-zoom)
                e.preventDefault();
                const currentX = e.touches[0].pageX;
                const currentY = e.touches[0].pageY;
                
                translateX = initialTranslateX + (currentX - startX);
                translateY = initialTranslateY + (currentY - startY);
                
                updateTransform();
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            // Jika jari dilepas, dan layar tidak di zoom, reset transformasi
            if (e.touches.length < 2 && currentScale <= 1) {
                currentScale = 1;
                translateX = 0;
                translateY = 0;
                updateTransform();
            }
        });


        /* 
         ========================================================================
         PLACEHOLDER FUNGSI DUMMY UNTUK UI
         Agar tombol-tombol pada HTML di atas tidak error saat di-klik
         ========================================================================
        */
        
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.add('block');
        }

        function handleLogout() {
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('block');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function closeDatabaseModal() {
            const modal = document.getElementById('databaseModal');
            const content = document.getElementById('databaseModalContent');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function openDatabaseModal(filter) {
            const modal = document.getElementById('databaseModal');
            const content = document.getElementById('databaseModalContent');
            modal.classList.remove('hidden');
            modal.classList.add('opacity-100');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);
            document.getElementById('databaseModalTitle').innerText = "Database: " + filter;
        }

        function toggleEditEwoModal() {
            const modal = document.getElementById('editEwoModal');
            if(modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
        
        // Tambahkan fungsi-fungsi lain yang dipanggil di HTML (opsional sesuai kebutuhan sistem asli Anda)
        function toggleInputModal() {}
        function toggleEWOModal() {}
        function toggleOTDRModal() {}
        function openMapModal() {}
    </script>
</body>
</html>
