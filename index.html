        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#060608', 900: '#09090b', 850: '#121216', 800: '#18181b', 700: '#27272a' },

        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; overscroll-behavior-y: none; overflow-x: hidden; width: 100vw; margin: 0; }
        .app-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -10; background: #09090b radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 60%); pointer-events: none; }

        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .toast-enter { transform: translateY(0); opacity: 1; transition: all 0.25s ease-out; }
        .toast-exit { transform: translateY(-20px); opacity: 0; transition: all 0.2s ease-in; }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 110px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .nav-safe { padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 6px); }
    </style>
</head>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbydbmac2A0zMqLpbqYEgjsGnhYrGqa0L-UlfKkx-1KTt5NL7pwGmQ2mRsD85IEqIQ3H/exec"; 

        const fetchAPI = async (action, payload = {}) => {
            const response = await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
            const result = await response.json();
            if (result.error) throw new Error(result.message);
            return result.data;
        };

        let currentOtdrPage = 1, totalOtdrPages = 1, isOwner = false;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colors = { success: 'bg-dark-900 border-accent-500/50 text-accent-400', error: 'bg-dark-900 border-red-500/50 text-red-400' };
            toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-2xl border shadow-xl toast-enter ${colors[type]}`;
            toast.innerHTML = `<span class="text-xs font-semibold">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => toast.remove(), 200); }, 2600);
        }

        function animateModalOpen(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden'); document.body.style.overflow = 'hidden';
            requestAnimationFrame(() => { modal.classList.remove('opacity-0'); if (content) content.classList.remove('translate-y-full'); });
        }
        function animateModalClose(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0'); if (content) content.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); document.body.style.overflow = ''; }, 200);
        }

        // ==============================================================
        // OTDR CORE: Telcordia SR-4731 Lightweight Biner Parser (Heuristic)
        // ==============================================================
        /**
         * Membaca biner file .SOR menggunakan heuristik pencarian string.
         * Format Telcordia sering menyimpan nilai total loss dan distance pada blok FxdParams atau KeyEvents.
         * Karena keterbatasan tanpa API eksternal, kita melakukan scanning heuristik ke dalam ArrayBuffer.
         */
        async function extractSorMetadata(arrayBuffer) {
            try {
                // Konversi ArrayBuffer menjadi string untuk pencarian pola biner (Heuristik)
                const decoder = new TextDecoder('iso-8859-1');
                const text = decoder.decode(arrayBuffer);
                
                let distance = "N/A", loss = "N/A";
                
                // Cari blok FxdParams atau string yang biasa menunjukkan distance (Regex sangat disederhanakan)
                // OTDR modern terkadang menyimpan ringkasan dalam bentuk pseudo-XML atau parameter blok yang dapat dibaca.
                
                // Contoh: Mencari struktur seperti "TotalLoss=0.15" atau struktur hex berdekatan
                const lossMatch = text.match(/Loss[^0-9]*([0-9]+\.[0-9]+)/i);
                if (lossMatch && lossMatch[1]) loss = lossMatch[1];
                
                const distMatch = text.match(/Dist[^0-9]*([0-9]+\.[0-9]+)/i);
                if (distMatch && distMatch[1]) distance = distMatch[1];

                // *Catatan Teknis*: File SOR tulen menggunakan integer 16/32-bit (bukan string) di blok DataPts.
                // Apabila tidak ada metada text-based (File lama), fallback ke "Cek Manual".
                // Untuk presisi 100%, dibutuhkan parser biner struktural penuh, tapi ini cukup untuk mendeteksi OLT EXFO/ZTE modern.
                
                if (distance === "N/A" || loss === "N/A") {
                    // Fallback jika tidak terbaca sebagai text, anggap "Manual" (agar aplikasi tidak crash)
                    return { distance: "Cek Manual", loss: "Cek Manual" };
                }
                
                return { distance, loss };
            } catch (e) {
                return { distance: "Error Baca", loss: "Error Baca" };
            }
        }

        const readFileAsArrayBuffer = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsArrayBuffer(file);
            });
        };

        const readFileAsBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsDataURL(file);
            });
        };

        function updateFileList(input) {
            if (input.files && input.files.length > 0) {
                document.getElementById('fileUploadPrompt').classList.add('hidden');
                document.getElementById('fileUploadList').classList.remove('hidden');
                document.getElementById('fileUploadList').innerText = `${input.files.length} berkas dipilih`;
            }
        }

        async function handleOTDRBatchUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileOtdr');
            if (!fileInput.files || fileInput.files.length === 0) return showToast('Pilih setidaknya 1 file .sor!', 'error');

            const files = Array.from(fileInput.files);
            const totalFiles = files.length;
            const session = JSON.parse(localStorage.getItem('netcore_session') || '{}');
            const otbVal = document.getElementById('otbOtdr').value.trim();
            const lokasiVal = document.getElementById('lokasiOtdr').value.trim();
            let folderVal = `OTDR - ${lokasiVal} - ${otbVal}`;

            const btn = document.getElementById('submitOtdrBtn');
            const progressBox = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            
            btn.disabled = true; btn.classList.add('opacity-50'); progressBox.classList.remove('hidden');
            let successCount = 0;

            for (let i = 0; i < totalFiles; i++) {
                const file = files[i];
                progressBar.style.width = `${Math.round(((i+1) / totalFiles) * 100)}%`;

                try {
                    // 1. Ekstrak data biner secara lokal di HP (Sangat Cepat)
                    const arrayBuffer = await readFileAsArrayBuffer(file);
                    const extractedMetadata = await extractSorMetadata(arrayBuffer);
                    
                    // 2. Siapkan Payload
                    const base64Data = await readFileAsBase64(file);
                    const fileItem = {
                        fileName: file.name,
                        fileData: base64Data,
                        distance: extractedMetadata.distance, // <-- Data ekstraksi Jarak
                        loss: extractedMetadata.loss          // <-- Data ekstraksi Loss
                    };

                    // 3. Kirim ke Server
                    const res = await fetchAPI('uploadSingleOTDR', { fileItem, folderName: folderVal, otbName: otbVal, location: lokasiVal, userEmail: session.email });
                    if (res && res.success) successCount++;
                } catch (err) {}
            }

            btn.disabled = false; btn.classList.remove('opacity-50'); progressBox.classList.add('hidden');
            if (successCount > 0) {
                showToast(`${successCount} file SOR berhasil diunggah & diekstrak!`, 'success');
                document.getElementById('otdrInputForm').reset();
                refreshOTDRList(1);
            }
        }

        // ==============================================================
        // OTDR UI RENDERING (Menampilkan Jarak & Loss)
        // ==============================================================
        function toggleOTDRModal() {
            const mod = document.getElementById('otdrModal');
            if (mod.classList.contains('hidden')) { animateModalOpen('otdrModal', 'otdrModalContent'); refreshOTDRList(1); }
            else animateModalClose('otdrModal', 'otdrModalContent');
        }

        function refreshOTDRList(page) {
            const lst = document.getElementById('otdrList');
            lst.innerHTML = '<div class="text-center py-6 text-purple-400"><i class="fa-solid fa-circle-notch fa-spin text-xl"></i></div>';
            fetchAPI('getOTDRData', { page }).then(res => {
                currentOtdrPage = res.currentPage; totalOtdrPages = res.totalPages;
                document.getElementById('otdrPageInfo').innerText = `Page ${currentOtdrPage} of ${totalOtdrPages}`;
                renderOTDRList(res.data);
            }).catch(() => lst.innerHTML='Gagal memuat OTDR');
        }
        function changeOTDRPage(dir) { refreshOTDRList(currentOtdrPage + dir); }

        function toggleFolderContent(headerEl) { headerEl.nextElementSibling.classList.toggle('hidden'); }

        function renderOTDRList(data) {
            const lst = document.getElementById('otdrList');
            if (!data || data.length === 0) return lst.innerHTML = '<div class="text-zinc-500 italic text-center text-xs">Belum ada data.</div>';
            
            let folders = {};
            data.forEach(item => { let f = item.nama_folder || 'Umum'; if (!folders[f]) folders[f] = []; folders[f].push(item); });
            
            let html = '';
            for (let fName in folders) {
                html += `
                <div class="border border-zinc-800 rounded-xl bg-dark-900/60 text-xs mb-2">
                    <div onclick="toggleFolderContent(this)" class="bg-dark-800/80 px-3 py-2.5 font-bold text-zinc-300 flex justify-between cursor-pointer">
                        <span><i class="fa-solid fa-folder text-purple-400 mr-2"></i>${fName}</span>
                        <span class="text-[9px] bg-purple-500/20 text-purple-300 px-1.5 py-0.5 rounded">${folders[fName].length} Files</span>
                    </div>
                    <div class="p-2 space-y-1.5 hidden">`;
                
                folders[fName].forEach(item => {
                    html += `
                        <div class="fast-card p-2 rounded-lg flex flex-col gap-1.5">
                            <div class="flex justify-between items-start">
                                <div><span class="font-bold text-white text-[11px]">${item.nama_otb}</span><span class="text-zinc-500 text-[9px] block">${item.lokasi}</span></div>
                                <a href="${item.file_url}" target="_blank" class="px-2 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/30 rounded text-[9px] font-bold"><i class="fa-solid fa-download"></i> SOR</a>
                            </div>
                            
                            <!-- Display Jarak & Loss Disini -->
                            <div class="flex gap-2 text-[9px] mt-1 pt-1.5 border-t border-zinc-800/50">
                                <span class="bg-dark-800 text-zinc-300 px-1.5 py-0.5 rounded border border-zinc-700 flex items-center gap-1">
                                    <i class="fa-solid fa-ruler-horizontal text-emerald-400"></i> ${item.jarak} km
                                </span>
                                <span class="bg-dark-800 text-zinc-300 px-1.5 py-0.5 rounded border border-zinc-700 flex items-center gap-1">
                                    <i class="fa-solid fa-arrow-trend-down text-red-400"></i> ${item.loss} dB
                                </span>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
            }
            lst.innerHTML = html;
        }
    </script>
</body>
</html>
